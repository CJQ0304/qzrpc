# ============================================================
# 轻舟 RPC (Qingzhou RPC) —— 内置注册中心配置
#
# 注册中心本身就是一个 qzrpc::rpc::Server，[Server] 段与 echo_server.conf 同义；
# [Registry] 段是它独有的两项（租约时长 / 清扫周期）。
#
#   registry_main --conf example/conf/registry.conf
#
# 命令行覆盖本文件，顺序是"先读 conf、再套 CLI"：`--port` / `--ttl` / `--sweep` /
# `--log-level` 都在 FromConfig() 之后才生效，所以下例能起在 16160 而不是这里的 16162。
#   registry_main --conf example/conf/registry.conf --port 16160
# （演示脚本就是这么起的：16161/16162 留给两个 echo_server，注册中心用 16160。）
# ============================================================

[Server]

bind_ip = 127.0.0.1
# 注册中心默认端口 16162（服务端默认 16161，两个不冲突）。
port = 16162
backlog = 512

io_thread_count = 2
worker_thread_count = 4
max_pending_tasks = 5000

max_connections = 5000
max_frame_size = 16777216
idle_timeout_ms = 0
enable_nodelay = true

# 注册请求很轻，1 秒足够；写太小会让网络抖动变成本地超时。
request_timeout_ms = 1000

enable_adaptive_reject = true
fast_reject_threshold_ms = 20
fast_reject_adjust_rate = 5

enable_metrics = true
# 注册中心也开一个 /metrics，方便演示页同时看服务端与注册中心。
metrics_port = 9103
metrics_bind_ip = 127.0.0.1
service_name = qzrpc.registry

graceful_shutdown_timeout_ms = 3000
log_level = 2

[Registry]

# 实例租约时长（毫秒）。超过该时长没心跳即被摘除。
# 取 15s 是为了"心跳 5s 一次"的客户端能容忍连续丢两次心跳。
instance_ttl_ms = 15000
# TTL 清扫线程周期（毫秒）。
sweep_interval_ms = 3000
# 同一 (service, host, port) 重复注册时覆盖而非报错（重启场景必需）。
allow_overwrite = true
