# ============================================================
# 轻舟 RPC (Qingzhou RPC) —— Echo 客户端配置
#
# 键名与 ClientOptions 的字段名一一对应；endpoint 列表用
# endpoint_count + endpoint_i 表示（与服务端配置的写法一致）。
#
# 双实例负载均衡演示：
#   echo_client --conf example/conf/echo_client.conf --loop 100
# 期望输出：两个端口各被调用 ~50 次（轮询在工作）。
#
# 命令行覆盖本文件，顺序是"先读 conf、再套 CLI"：--servers / --once / --loop /
# --bench 都在配置加载完之后才生效，所以 `--conf x.conf --servers 127.0.0.1:16161`
# 用的是命令行给的那一个地址，不是下面 endpoint_count/endpoint_i 的两个。
# ============================================================

[Client]

service_name = demo.EchoService
caller_name = echo_client

# ---- 目标 ----
# 静态 endpoint 列表。两个地址 → 轮询负载均衡把请求分发到两个实例。
endpoint_count = 2
endpoint_0 = 127.0.0.1:16161
endpoint_1 = 127.0.0.1:16162

# ---- 超时与重试 ----
connect_timeout_ms = 200
request_timeout_ms = 1000
# 最大重试次数（不含首次）。只有"幂等方法 + 可重试错误"才会真的重试。
max_retries = 2
retry_backoff_ms = 20
acquire_timeout_ms = 200

# ---- 连接池 ----
# 每个 endpoint 的长连接数。演示分发时设 1 更容易看出轮询；
# 压测时建议 2~4。
connections_per_endpoint = 1
idle_connection_timeout_ms = 60000
enable_nodelay = true
max_frame_size = 16777216

# ---- 熔断 ----
breaker_failure_threshold = 5
breaker_cooldown_ms = 5000

# ---- 服务发现 ----
# 留空 = 只用静态 endpoints。填 "127.0.0.1:16162" 则从注册中心拉取实例列表，
# 静态 endpoints 退化为"注册中心不可用时的兜底"。
registry_endpoint =
registry_poll_interval_ms = 3000
registry_request_timeout_ms = 1000

# ---- 可观测性 ----
enable_metrics = true
# 每次调用自动生成 trace_id（16 进制串），写进请求 metadata。
auto_trace_id = true
