# ============================================================
# 轻舟 RPC (Qingzhou RPC) —— Echo 服务端配置
#
# 键名与 ServerOptions 的字段名一一对应（权威模板见
# `echo_server --dump-conf`，它输出的就是当前生效值）。
#
# 起两个实例做负载均衡演示：
#   echo_server --conf example/conf/echo_server.conf
#   echo_server --conf example/conf/echo_server.conf --port 16162 --metrics-port 9102
#
# ⚠ 命令行与配置文件的顺序：**先读 conf，再套 CLI**。
#   本文件的 port = 16161，第二条命令能起在 16162，是因为实现里把 `--port` /
#   `--metrics-port` / `--bind-ip` / `--log-level` / `--registry` 先记成"覆盖项"，
#   等 FromConfig() 把本文件读完之后才 ApplyTo()。顺序反过来（先套 CLI 再读文件）
#   会让文件里的值反悔命令行，第二条命令会静默退回 16161 并和第一个实例撞端口。
#   所以：**命令行永远赢**。`--dump-conf` 打印的是"套完 CLI 之后"的生效值，
#   想确认某个参数到底生效没有，跑一遍 --dump-conf 比看本文件可靠。
# ============================================================

[Server]

# ---- 网络 ----
# 监听地址。0.0.0.0 = 全部网卡；只支持 IP 字面量（不做域名解析）。
bind_ip = 0.0.0.0
# 监听端口。0 = 由系统分配（脚本可从 "QZRPC_READY port=..." 那行读到）。
port = 16161
# 已完成三次握手、尚未 accept 的队列长度。
backlog = 1024

# ---- 线程模型 ----
# IO 从 Reactor 线程数，建议 min(CPU 核数, 8)。
io_thread_count = 4
# 业务线程数。Echo 是纯 CPU 微操作，给 4 就够；有阻塞调用时要给足。
worker_thread_count = 4
# 业务队列上限。满了立即回 OVERLOAD 帧（不静默丢请求）。
max_pending_tasks = 20000

# ---- 连接与超时 ----
max_connections = 10000
# 单帧 body 上限（metadata + payload）。硬上限 64 MiB。
max_frame_size = 16777216
# 空闲连接回收（毫秒）。0 = 不回收。
idle_timeout_ms = 0
max_accept_batch = 64
enable_nodelay = true

# ---- 业务超时 ----
# 超时只回 kTimeout 并记 metrics，**不强行杀死业务线程**（C++ 无法安全中断线程）。
request_timeout_ms = 3000

# ---- 过载保护 ----
enable_adaptive_reject = true
fast_reject_threshold_ms = 20
fast_reject_adjust_rate = 5

# ---- 可观测性 ----
enable_metrics = true
# 内建 /metrics 的独立 HTTP 端口。0 = 不启动。
# 演示页 example/web/index.html 就是 fetch 这个地址。
metrics_port = 9101
metrics_bind_ip = 127.0.0.1
service_name = demo.EchoService

# ---- 优雅停机 ----
# 排空在飞请求的最长等待。超时后强制关闭连接。
graceful_shutdown_timeout_ms = 5000

# 0=TRACE 1=DEBUG 2=INFO 3=WARN 4=ERROR 5=OFF
log_level = 2
